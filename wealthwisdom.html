/* ---------- CREDIT & DEBT ---------- */

{t:'l',c:'Money Psychology',s:'Lifestyle Creep',e:'As income rises, spending quietly rises to match it \u2014 a nicer car, a bigger place, pricier habits. Before long, a raise disappears and nothing is left over. The people who build real wealth are not always the highest earners. They are the ones who keep their lifestyle a step behind their income.'},
{t:'l',c:'Money Psychology',s:'Scarcity Mindset',e:'A scarcity mindset treats money as something that is always about to run out, which can push people toward hoarding, fear-based decisions, or avoiding smart risks entirely. A healthier approach treats money as a tool to be managed with intention, not a threat to react to.'},
{t:'l',c:'Money Psychology',s:'Loss Aversion',e:'People tend to feel the pain of losing money more sharply than the pleasure of gaining the same amount. This can cause otherwise smart people to hold onto bad investments too long, or avoid good opportunities out of fear of a small loss.'},
{t:'l',c:'Money Psychology',s:'Present Bias',e:'The brain is wired to value a reward today over a bigger reward later, even when the math clearly favors waiting. Recognizing this bias is often the first step toward making decisions your future self will thank you for.'},
{t:'l',c:'Money Psychology',s:'Social Comparison',e:'Spending decisions are often shaped less by personal needs and more by what everyone else seems to have. Wealth built to keep up with others rarely leads anywhere. Wealth built around personal goals usually does.'},
{t:'l',c:'Money Psychology',s:'The Sunk Cost Trap',e:'Continuing to invest time or money into something simply because you have already invested in it, even after it is clearly not working, is one of the most common decision-making traps. Good decisions are made based on what happens next, not what has already been spent.'},
{t:'l',c:'Money Psychology',s:'Anchoring',e:'The first number you see tends to shape how you judge everything that follows, even when that number was arbitrary. Being aware of this helps people negotiate, shop, and invest based on real value rather than whatever number showed up first.'},
{t:'l',c:'Money Psychology',s:'Mental Accounting',e:'People often treat money differently depending on where it came from. A bonus gets spent freely while a paycheck gets budgeted carefully, even though a dollar is a dollar no matter its source. Recognizing this habit leads to more consistent financial decisions.'},

{t:'l',c:'Protection & Legacy',s:'What a Trust Actually Does',e:'A trust is a legal arrangement that holds assets on behalf of beneficiaries, often allowing an estate to avoid the public, sometimes lengthy probate process that a simple will does not avoid. Trusts can also control exactly how and when assets are distributed.'},
{t:'l',c:'Protection & Legacy',s:'Wills vs. Trusts',e:'A will states who gets what after death, but typically still goes through probate. A trust can transfer assets directly, often faster and more privately. Many complete estate plans use both, each serving a different purpose.'},
{t:'l',c:'Protection & Legacy',s:'Beneficiary Designations',e:'Retirement accounts, life insurance policies, and some other assets pass directly to whoever is named as beneficiary, regardless of what a will says. Forgetting to update these after a major life change is one of the most common estate-planning mistakes.'},
{t:'l',c:'Protection & Legacy',s:'Power of Attorney',e:'This is a legal document that lets someone else make financial or medical decisions on your behalf if you are unable to. Having one in place before it is needed protects both the person and their family from confusion during a crisis.'},
{t:'l',c:'Protection & Legacy',s:'Estate Planning Basics',e:'Estate planning is not just for the wealthy. It is the process of deciding who gets what, who makes decisions if you cannot, and how to minimize stress and cost for the people left behind. Even a basic plan is better than none.'},
{t:'l',c:'Protection & Legacy',s:'The Emergency Fund as Protection',e:'An emergency fund is not an investment. It is protection. Its job is to absorb a job loss, medical bill, or repair without forcing debt or the sale of long-term investments at a bad time.'},
{t:'l',c:'Protection & Legacy',s:'Umbrella Coverage for Growing Wealth',e:'As someone\u2019s assets grow, so does what they stand to lose in a lawsuit. Umbrella liability coverage extends protection beyond standard policy limits, which becomes more important the more there is to protect.'},
{t:'l',c:'Protection & Legacy',s:'Business Succession Planning',e:'Many business owners build something valuable but never plan for what happens to it if they step away, retire, or pass away. A succession plan protects the business, the employees, and the family\u2019s financial interest in it.'},
{t:'l',c:'Protection & Legacy',s:'Teaching the Next Generation',e:'Passing down money without passing down financial knowledge often leads to that money disappearing within a generation. Real generational wealth includes teaching the habits and thinking that built it in the first place.'},

/* ---------- LESSONS: PRACTICAL MONEY WISDOM ---------- */
{t:'l',c:'Practical Money Wisdom',s:'Pay Yourself First',e:'Before paying bills or spending on wants, set aside a portion of every dollar earned for savings or investing, even a small amount. Treating savings like a non-negotiable expense, rather than whatever is left over, is one of the simplest habits that separates people who build wealth from people who just get by.'},
{t:'l',c:'Practical Money Wisdom',s:'The Emergency Fund Cushion',e:'Life reliably throws unexpected costs at everyone \u2014 a car repair, a medical bill, a slow month. A cash cushion set aside specifically for these moments prevents small surprises from turning into long-term debt.'},
{t:'l',c:'Practical Money Wisdom',s:'Debt That Builds vs. Debt That Drains',e:'Debt used to build something \u2014 a home, an education, a business \u2014 can be a tool. Debt used to fund a lifestyle beyond what income supports tends to quietly erode financial freedom over time.'},
{t:'l',c:'Practical Money Wisdom',s:'Track Before You Budget',e:'Most people cannot successfully budget until they know where money is actually going. A week or two of honest tracking often reveals surprising patterns before a single budget rule is even set.'},
{t:'l',c:'Practical Money Wisdom',s:'A Budget Is a Plan, Not a Punishment',e:'A good budget is not about restriction. It is about deciding in advance where money goes, so decisions are not made under pressure or guilt in the moment.'},
{t:'l',c:'Practical Money Wisdom',s:'Negotiate Before You Accept',e:'Whether it is a salary, a bill, or a big purchase, the first number offered is rarely the only number available. Asking is often the only step separating people from a better deal.'},
{t:'l',c:'Practical Money Wisdom',s:'Do Not Invest in What You Do Not Understand',e:'If an investment cannot be explained simply, that is a signal to learn more before committing money to it, not a reason to trust it blindly because someone else seems confident.'},
{t:'l',c:'Practical Money Wisdom',s:'Automate the Habit',e:'Willpower runs out. Automation does not. Setting up automatic transfers to savings or investments removes the daily decision and makes consistency effortless.'},
{t:'l',c:'Practical Money Wisdom',s:'Opportunity Cost',e:'Every dollar spent or invested one way is a dollar that cannot be used somewhere else. Good financial decisions weigh not just the choice in front of you, but what you are giving up by choosing it.'},
{t:'l',c:'Practical Money Wisdom',s:'Neither Fear Nor Greed',e:'Some of the costliest financial decisions come from panic during a downturn or overconfidence during a boom. Steady, informed decisions, made without either emotion driving the wheel, tend to outperform reactive ones over time.'}
];

</script>
<script>
/* ==========================================================
   Legacy Wealth — QR companion card engine
   Shared by Wealth Wisdom and Business Blueprint.

   A deck file must set, before this script runs:
     window.LW_CONFIG = { id:'wealth-wisdom', label:'Wealth Wisdom' }
     window.LW_DECK   = [ ...cards... ]

   Card shapes:
     True/False : { t:'tf', c:'Category', s:'Statement', a:true|false, e:'Explanation' }
     Lesson     : { t:'l',  c:'Category', s:'Title',     e:'Teaching text' }
     Flashcard  : { t:'fc', c:'Category', s:'TERM', d:'What it is', x:'In practice' }
   ========================================================== */

(function () {
  'use strict';

  var CFG   = window.LW_CONFIG || { id: 'deck', label: 'Legacy Wealth' };
  var DECK  = Array.isArray(window.LW_DECK) ? window.LW_DECK : [];
  var QKEY  = 'lw_' + CFG.id + '_queue_v1';
  var CKEY  = 'lw_' + CFG.id + '_current_v1';
  var STICKY_TTL = 5 * 60 * 1000; // 5 minutes — backstop only

  var cardEl  = document.getElementById('card');
  var againEl = document.getElementById('again');

  /* ---------- Storage with in-memory fallback ----------
     Private browsing and locked-down webviews can throw on
     localStorage. The page must never break because of it.   */
  var mem = {};
  var store = {
    get: function (k) {
      try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
      catch (e) { return mem[k] !== undefined ? mem[k] : null; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); }
      catch (e) { mem[k] = v; }
    },
    del: function (k) {
      try { localStorage.removeItem(k); } catch (e) { delete mem[k]; }
    }
  };

  /* ---------- Analytics (no-op unless a provider is loaded) ----------
     Privacy-light: fires a named event only. No personal data,
     no cookies, no identifiers.                                        */
  function track(event, props) {
    try {
      if (typeof window.plausible === 'function') {
        window.plausible(event, props ? { props: props } : undefined);
      }
    } catch (e) { /* analytics must never break the page */ }
  }

  /* ---------- Fisher-Yates shuffle ---------- */
  function shuffledIndexes() {
    var idx = DECK.map(function (_, i) { return i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    return idx;
  }

  /* ---------- Draw without replacement ---------- */
  function drawNext() {
    var queue = store.get(QKEY);
    var reshuffled = false;
    if (!Array.isArray(queue) || queue.length === 0) {
      queue = shuffledIndexes();
      reshuffled = true;
    }
    var pick = queue.shift();
    store.set(QKEY, queue);
    if (typeof pick !== 'number' || !DECK[pick]) { pick = 0; }
    return { index: pick, remaining: queue.length, reshuffled: reshuffled };
  }

  /* ---------- Should this page load show the previous card? ----------
     A QR scan is a fresh navigation -> new card.
     A refresh, back button, or restored tab -> keep the same card,
     so nobody loses the card they were mid-way through reading.       */
  function isReturningView() {
    try {
      var nav = performance.getEntriesByType('navigation')[0];
      if (nav && (nav.type === 'reload' || nav.type === 'back_forward')) return true;
    } catch (e) { /* fall through to TTL check */ }
    return false;
  }

  function readSticky() {
    var s = store.get(CKEY);
    if (!s || typeof s.index !== 'number' || !DECK[s.index]) return null;
    if (Date.now() - (s.at || 0) > STICKY_TTL) return null;
    return s;
  }

  function writeSticky(index, answered, guess) {
    store.set(CKEY, { index: index, answered: !!answered, guess: guess, at: Date.now() });
  }

  /* ---------- Escaping ---------- */
  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  /* ---------- Render ---------- */
  function replay(el) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }

  function showEmpty() {
    cardEl.innerHTML =
      '<div class="fallback">' +
        '<h2>Nothing to show yet</h2>' +
        '<p>This deck has no cards loaded. Check that the deck file is published alongside this page.</p>' +
      '</div>';
    againEl.hidden = true;
  }

  function renderReveal(item, correct) {
    var rev = document.createElement('div');
    rev.className = 'reveal';
    rev.innerHTML =
      '<div class="verdict">' +
        '<span class="verdict-word">' + (item.a ? 'True' : 'False') + '</span>' +
        '<span class="verdict-note ' + (correct ? 'right' : 'wrong') + '">' +
          (correct ? 'You got it' : 'Not quite') +
        '</span>' +
      '</div>' +
      '<p class="explain">' + esc(item.e) + '</p>';
    cardEl.appendChild(rev);
    againEl.textContent = 'Draw another';
  }

  function render(index, restore) {
    var item = DECK[index];
    if (!item) { showEmpty(); return; }
    replay(cardEl);

    /* --- Lesson --- */
    if (item.t === 'l') {
      cardEl.innerHTML =
        '<div class="kicker"><span class="badge">Wealth Lesson</span>' +
        '<span class="cat">' + esc(item.c) + '</span></div>' +
        '<h2 class="lesson-title">' + esc(item.s) + '</h2>' +
        '<p class="lesson-body">' + esc(item.e) + '</p>';
      againEl.textContent = 'Draw another';
      writeSticky(index, true, null);
      return;
    }

    /* --- Flashcard: term, then reveal definition + example --- */
    if (item.t === 'fc') {
      cardEl.innerHTML =
        '<div class="kicker"><span class="badge">Business Term</span>' +
        '<span class="cat">' + esc(item.c) + '</span></div>' +
        '<h2 class="term">' + esc(item.s) + '</h2>' +
        '<div class="choices single">' +
          '<button class="choice" type="button" data-reveal="1">Reveal</button>' +
        '</div>';
      againEl.textContent = 'Skip to another';

      var revealBtn = cardEl.querySelector('[data-reveal]');
      if (revealBtn) {
        revealBtn.addEventListener('click', function () {
          revealTerm(index, item);
        });
      }

      if (restore && restore.answered) {
        revealTerm(index, item, true);
      } else {
        writeSticky(index, false, null);
      }
      return;
    }

    /* --- True / False --- */
    cardEl.innerHTML =
      '<div class="kicker"><span class="badge">True or False</span>' +
      '<span class="cat">' + esc(item.c) + '</span></div>' +
      '<p class="statement quoted">' + esc(item.s) + '</p>' +
      '<div class="choices">' +
        '<button class="choice" type="button" data-pick="true">True</button>' +
        '<button class="choice" type="button" data-pick="false">False</button>' +
      '</div>';
    againEl.textContent = 'Skip to another';

    Array.prototype.forEach.call(cardEl.querySelectorAll('.choice'), function (btn) {
      btn.addEventListener('click', function () {
        var guess = btn.dataset.pick === 'true';
        answer(index, item, guess);
      });
    });

    /* Restoring a card that was already answered before a refresh */
    if (restore && restore.answered && restore.guess !== null && restore.guess !== undefined) {
      var choices = cardEl.querySelector('.choices');
      if (choices) choices.remove();
      renderReveal(item, restore.guess === item.a);
    } else {
      writeSticky(index, false, null);
    }
  }

  function revealTerm(index, item, silent) {
    var choices = cardEl.querySelector('.choices');
    if (choices) choices.remove();

    var rev = document.createElement('div');
    rev.className = 'reveal';
    rev.innerHTML =
      '<p class="field-label">What it is</p>' +
      '<p class="field-text">' + esc(item.d) + '</p>' +
      '<p class="field-label spaced">In practice</p>' +
      '<p class="field-text">' + esc(item.x) + '</p>';
    cardEl.appendChild(rev);

    againEl.textContent = 'Draw another';
    writeSticky(index, true, null);
    if (!silent) track('Term Revealed', { deck: CFG.label, category: item.c });
  }

  function answer(index, item, guess) {
    var correct = guess === item.a;
    var choices = cardEl.querySelector('.choices');
    if (choices) choices.remove();
    renderReveal(item, correct);
    writeSticky(index, true, guess);
    track('WW Answer', { deck: CFG.label, category: item.c, correct: correct ? 'yes' : 'no' });
  }

  /* ---------- Boot ---------- */
  function boot() {
    if (!cardEl || !againEl) return;
    if (DECK.length === 0) { showEmpty(); return; }

    againEl.addEventListener('click', function () {
      var d = drawNext();
      store.del(CKEY);
      render(d.index, null);
      track('Card Drawn', { deck: CFG.label, source: 'button' });
      if (d.reshuffled) track('Deck Reshuffled', { deck: CFG.label });
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
      catch (e) { window.scrollTo(0, 0); }
    });

    var sticky = isReturningView() ? readSticky() : null;
    if (sticky) {
      render(sticky.index, sticky);
    } else {
      var d = drawNext();
      render(d.index, null);
      track('Card Drawn', { deck: CFG.label, source: 'scan' });
      if (d.reshuffled) track('Deck Reshuffled', { deck: CFG.label });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
</body>
</html>
