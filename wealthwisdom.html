window.LW_DECK = [
/* ---------- INVESTING BASICS ---------- */
{t:'tf',c:'Investing Basics',s:'The stock market always goes up in the short term.',a:false,e:'Markets can swing sharply over days, months, even years. The upward trend historically shows up over the long run, not the short run.'},
{t:'tf',c:'Investing Basics',s:'You need a lot of money to start investing.',a:false,e:'Many platforms let people start with small, regular amounts. Consistency over time matters more than the size of the first contribution.'},
{t:'tf',c:'Investing Basics',s:'Index funds are designed to match a market\u2019s overall performance, not beat it.',a:true,e:'They are built to track a benchmark as closely as possible rather than try to outperform it.'},
{t:'tf',c:'Investing Basics',s:'Higher-risk investments always guarantee higher returns.',a:false,e:'Risk widens the range of possible outcomes. It does not guarantee a better one.'},

{t:'tf',c:'Investing Basics',s:'Dollar-cost averaging means investing the same amount at regular intervals regardless of price.',a:true,e:'This spreads purchases out over time so no single price point makes or breaks the outcome.'},

/* ---------- CREDIT & DEBT ---------- */
{t:'tf',c:'Credit & Debt',s:'Paying only the minimum on a credit card balance means you avoid all extra costs.',a:false,e:'Interest keeps accruing on whatever balance is left. Minimum payments can stretch a balance out for years.'},

/* ---------- PROTECTION & LEGACY ---------- */
{t:'tf',c:'Protection & Legacy',s:'Term life insurance generally costs significantly less than whole life insurance for the same death benefit.',a:true,e:'Term covers a set number of years and exists purely for protection. Whole life lasts a lifetime and builds cash value, but costs far more.'},
{t:'tf',c:'Protection & Legacy',s:'A trust can often let an estate avoid the public probate process that a simple will typically does not avoid.',a:true,e:'Trusts hold assets on behalf of beneficiaries and can control exactly how and when assets are distributed, often more privately than a will.'},
{t:'tf',c:'Protection & Legacy',s:'A will and a trust accomplish exactly the same thing, so having both is unnecessary.',a:false,e:'A will typically still goes through probate, while a trust can transfer assets directly. Many complete estate plans use both.'},
{t:'tf',c:'Protection & Legacy',s:'Retirement accounts and life insurance policies pass to whoever is named as beneficiary, regardless of what a will says.',a:true,e:'Forgetting to update these after a major life change is one of the most common estate-planning mistakes.'},
{t:'tf',c:'Protection & Legacy',s:'A power of attorney only matters after a person has already passed away.',a:false,e:'It lets someone make financial or medical decisions on your behalf while you are alive but unable to, protecting you and your family during a crisis.'},
{t:'tf',c:'Protection & Legacy',s:'Estate planning is only necessary for people with significant wealth.',a:false,e:'Anyone with assets, dependents, or wishes for how things are handled can benefit from even a basic plan.'},
{t:'tf',c:'Protection & Legacy',s:'An emergency fund should be treated as an investment meant to grow as much as possible.',a:false,e:'An emergency fund\u2019s job is protection, not growth \u2014 absorbing a job loss or repair without forcing debt or a bad-time asset sale.'},
{t:'tf',c:'Protection & Legacy',s:'As a person\u2019s assets grow, the potential financial loss from a lawsuit generally grows with them.',a:true,e:'Umbrella liability coverage extends protection beyond standard policy limits, which becomes more important the more there is to protect.'},
{t:'tf',c:'Protection & Legacy',s:'Most business owners have a clear, documented plan for what happens to their business if they step away or pass away.',a:false,e:'Many build something valuable but never plan for what happens next. A succession plan protects the business, employees, and the family\u2019s financial interest.'},
{t:'tf',c:'Protection & Legacy',s:'Passing down money without passing down financial knowledge tends to preserve wealth across generations.',a:false,e:'Real generational wealth includes teaching the habits and thinking that built it. Money alone often disappears within a generation.'},

/* ---------- PRACTICAL MONEY WISDOM ---------- */
{t:'tf',c:'Practical Money Wisdom',s:'Saving whatever is left over after all spending is generally more effective than saving first.',a:false,e:'Treating savings like a non-negotiable expense, rather than whatever is left over, is one of the simplest habits separating people who build wealth from people who just get by.'},
{t:'tf',c:'Practical Money Wisdom',s:'Having cash set aside specifically for unexpected costs can prevent small surprises from becoming long-term debt.',a:true,e:'A car repair, a medical bill, or a slow month can turn into real debt without this cushion in place.'},
{t:'tf',c:'Practical Money Wisdom',s:'All debt has essentially the same effect on a person\u2019s long-term financial freedom.',a:false,e:'Debt used to build something like a home or a business can be a tool. Debt used to fund a lifestyle beyond what income supports tends to erode freedom over time.'},
{t:'tf',c:'Practical Money Wisdom',s:'Most people can successfully build a budget without first tracking where their money actually goes.',a:false,e:'A week or two of honest tracking often reveals surprising spending patterns before a single budget rule is even set.'},
{t:'tf',c:'Practical Money Wisdom',s:'A good budget is primarily about restricting spending as much as possible.',a:false,e:'A budget is about deciding in advance where money goes, so decisions are not made under pressure or guilt later.'},
{t:'tf',c:'Practical Money Wisdom',s:'The first number offered in a salary negotiation, bill, or big purchase is usually the only number available.',a:false,e:'Asking is often the only step separating people from a better deal.'},
{t:'tf',c:'Practical Money Wisdom',s:'If an investment cannot be explained simply, that is a signal to learn more before committing money to it.',a:true,e:'Trusting an investment blindly because someone else seems confident is a common and costly mistake.'},
{t:'tf',c:'Practical Money Wisdom',s:'Relying on willpower alone is generally more effective than automating savings.',a:false,e:'Willpower runs out, automation does not. Setting up automatic transfers removes the daily decision and makes consistency effortless.'},
{t:'tf',c:'Practical Money Wisdom',s:'Every dollar spent or invested one way could have been used somewhere else instead.',a:true,e:'This is called opportunity cost. Good financial decisions weigh not just the choice in front of you, but what you are giving up by choosing it.'},
{t:'tf',c:'Practical Money Wisdom',s:'Some of the costliest financial decisions come from panic during downturns or overconfidence during booms.',a:true,e:'Steady, informed decisions made without either emotion driving the wheel tend to outperform reactive ones over time.'}
];

</script>
<script>
/* ==========================================================
   Legacy Wealth — QR companion card engine
   Shared by Wealth Wisdom and Business Blueprint.

   A deck file must set, before this script runs:
     window.LW_CONFIG = { id:'wealth-wisdom', label:'Wealth Wisdom' }
     window.LW_DECK   = [ ...cards... ]

   Card shapes:
     True/False : { t:'tf', c:'Category', s:'Statement', a:true|false, e:'Explanation' }
     Lesson     : { t:'l',  c:'Category', s:'Title',     e:'Teaching text' }
     Flashcard  : { t:'fc', c:'Category', s:'TERM', d:'What it is', x:'In practice' }
   ========================================================== */

(function () {
  'use strict';

  var CFG   = window.LW_CONFIG || { id: 'deck', label: 'Legacy Wealth' };
  var DECK  = Array.isArray(window.LW_DECK) ? window.LW_DECK : [];
  var QKEY  = 'lw_' + CFG.id + '_queue_v1';
  var CKEY  = 'lw_' + CFG.id + '_current_v1';
  var STICKY_TTL = 5 * 60 * 1000; // 5 minutes — backstop only

  var cardEl  = document.getElementById('card');
  var againEl = document.getElementById('again');

  /* ---------- Storage with in-memory fallback ----------
     Private browsing and locked-down webviews can throw on
     localStorage. The page must never break because of it.   */
  var mem = {};
  var store = {
    get: function (k) {
      try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
      catch (e) { return mem[k] !== undefined ? mem[k] : null; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); }
      catch (e) { mem[k] = v; }
    },
    del: function (k) {
      try { localStorage.removeItem(k); } catch (e) { delete mem[k]; }
    }
  };

  /* ---------- Analytics (no-op unless a provider is loaded) ----------
     Privacy-light: fires a named event only. No personal data,
     no cookies, no identifiers.                                        */
  function track(event, props) {
    try {
      if (typeof window.plausible === 'function') {
        window.plausible(event, props ? { props: props } : undefined);
      }
    } catch (e) { /* analytics must never break the page */ }
  }

  /* ---------- Fisher-Yates shuffle ---------- */
  function shuffledIndexes() {
    var idx = DECK.map(function (_, i) { return i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    return idx;
  }

  /* ---------- Draw without replacement ---------- */
  function drawNext() {
    var queue = store.get(QKEY);
    var reshuffled = false;
    if (!Array.isArray(queue) || queue.length === 0) {
      queue = shuffledIndexes();
      reshuffled = true;
    }
    var pick = queue.shift();
    store.set(QKEY, queue);
    if (typeof pick !== 'number' || !DECK[pick]) { pick = 0; }
    return { index: pick, remaining: queue.length, reshuffled: reshuffled };
  }

  /* ---------- Should this page load show the previous card? ----------
     A QR scan is a fresh navigation -> new card.
     A refresh, back button, or restored tab -> keep the same card,
     so nobody loses the card they were mid-way through reading.       */
  function isReturningView() {
    try {
      var nav = performance.getEntriesByType('navigation')[0];
      if (nav && (nav.type === 'reload' || nav.type === 'back_forward')) return true;
    } catch (e) { /* fall through to TTL check */ }
    return false;
  }

  function readSticky() {
    var s = store.get(CKEY);
    if (!s || typeof s.index !== 'number' || !DECK[s.index]) return null;
    if (Date.now() - (s.at || 0) > STICKY_TTL) return null;
    return s;
  }

  function writeSticky(index, answered, guess) {
    store.set(CKEY, { index: index, answered: !!answered, guess: guess, at: Date.now() });
  }

  /* ---------- Escaping ---------- */
  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  /* ---------- Render ---------- */
  function replay(el) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }

  function showEmpty() {
    cardEl.innerHTML =
      '<div class="fallback">' +
        '<h2>Nothing to show yet</h2>' +
        '<p>This deck has no cards loaded. Check that the deck file is published alongside this page.</p>' +
      '</div>';
    againEl.hidden = true;
  }

  function renderReveal(item, correct) {
    var rev = document.createElement('div');
    rev.className = 'reveal';
    var html =
      '<div class="verdict">' +
        '<span class="verdict-word">' + (item.a ? 'True' : 'False') + '</span>' +
        '<span class="verdict-note ' + (correct ? 'right' : 'wrong') + '">' +
          (correct ? 'You got it' : 'Not quite') +
        '</span>' +
      '</div>' +
      '<p class="explain">' + esc(item.e) + '</p>';
    if (correct && CFG.reward) {
      html += '<div class="reward-line">Collect $' +
        Number(CFG.reward).toLocaleString('en-US') + ' from the bank.</div>';
    }
    rev.innerHTML = html;
    cardEl.appendChild(rev);
    againEl.textContent = 'Draw another';
  }

  function render(index, restore) {
    var item = DECK[index];
    if (!item) { showEmpty(); return; }
    replay(cardEl);

    /* --- Lesson --- */
    if (item.t === 'l') {
      cardEl.innerHTML =
        '<div class="kicker"><span class="badge">Wealth Lesson</span>' +
        '<span class="cat">' + esc(item.c) + '</span></div>' +
        '<h2 class="lesson-title">' + esc(item.s) + '</h2>' +
        '<p class="lesson-body">' + esc(item.e) + '</p>';
      againEl.textContent = 'Draw another';
      writeSticky(index, true, null);
      return;
    }

    /* --- Flashcard: term as a question, then reveal all fields + reward --- */
    if (item.t === 'fc') {
      cardEl.innerHTML =
        '<div class="kicker"><span class="badge">Business Term</span>' +
        '<span class="cat">' + esc(item.c) + '</span></div>' +
        '<h2 class="term">What is ' + esc(item.s) + (item.ctx ? ' <span class="term-ctx">' + esc(item.ctx) + '</span>' : '') + '?</h2>' +
        '<div class="choices single">' +
          '<button class="choice" type="button" data-reveal="1">Reveal Answer</button>' +
        '</div>';
      againEl.textContent = 'Skip to another';

      var revealBtn = cardEl.querySelector('[data-reveal]');
      if (revealBtn) {
        revealBtn.addEventListener('click', function () {
          revealTerm(index, item);
        });
      }

      if (restore && restore.answered) {
        revealTerm(index, item, true);
      } else {
        writeSticky(index, false, null);
      }
      return;
    }

    /* --- True / False --- */
    cardEl.innerHTML =
      '<div class="kicker"><span class="badge">True or False</span>' +
      '<span class="cat">' + esc(item.c) + '</span></div>' +
      '<p class="statement quoted">' + esc(item.s) + '</p>' +
      '<div class="choices">' +
        '<button class="choice" type="button" data-pick="true">True</button>' +
        '<button class="choice" type="button" data-pick="false">False</button>' +
      '</div>';
    againEl.textContent = 'Skip to another';

    Array.prototype.forEach.call(cardEl.querySelectorAll('.choice'), function (btn) {
      btn.addEventListener('click', function () {
        var guess = btn.dataset.pick === 'true';
        answer(index, item, guess);
      });
    });

    /* Restoring a card that was already answered before a refresh */
    if (restore && restore.answered && restore.guess !== null && restore.guess !== undefined) {
      var choices = cardEl.querySelector('.choices');
      if (choices) choices.remove();
      renderReveal(item, restore.guess === item.a);
    } else {
      writeSticky(index, false, null);
    }
  }

  function revealTerm(index, item, silent) {
    var choices = cardEl.querySelector('.choices');
    if (choices) choices.remove();

    var rev = document.createElement('div');
    rev.className = 'reveal';
    var html =
      '<p class="field-label">Definition</p>' +
      '<p class="field-text">' + esc(item.d) + '</p>' +
      '<p class="field-label spaced">Why It Matters</p>' +
      '<p class="field-text">' + esc(item.w) + '</p>' +
      '<p class="field-label spaced">Business Example</p>' +
      '<p class="field-text">' + esc(item.x) + '</p>' +
      '<p class="field-label spaced">Quick Tip</p>' +
      '<p class="field-text">' + esc(item.tip) + '</p>';
    if (CFG.reward) {
      html += '<div class="reward-line">Got it right? Collect $' +
        Number(CFG.reward).toLocaleString('en-US') + ' from the bank.</div>';
    }
    rev.innerHTML = html;
    cardEl.appendChild(rev);

    againEl.textContent = 'Draw another';
    writeSticky(index, true, null);
    if (!silent) track('Term Revealed', { deck: CFG.label, category: item.c });
  }

  function answer(index, item, guess) {
    var correct = guess === item.a;
    var choices = cardEl.querySelector('.choices');
    if (choices) choices.remove();
    renderReveal(item, correct);
    writeSticky(index, true, guess);
    track('WW Answer', { deck: CFG.label, category: item.c, correct: correct ? 'yes' : 'no' });
  }

  /* ---------- Boot ---------- */
  function boot() {
    if (!cardEl || !againEl) return;
    if (DECK.length === 0) { showEmpty(); return; }

    againEl.addEventListener('click', function () {
      var d = drawNext();
      store.del(CKEY);
      render(d.index, null);
      track('Card Drawn', { deck: CFG.label, source: 'button' });
      if (d.reshuffled) track('Deck Reshuffled', { deck: CFG.label });
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
      catch (e) { window.scrollTo(0, 0); }
    });

    var sticky = isReturningView() ? readSticky() : null;
    if (sticky) {
      render(sticky.index, sticky);
    } else {
      var d = drawNext();
      render(d.index, null);
      track('Card Drawn', { deck: CFG.label, source: 'scan' });
      if (d.reshuffled) track('Deck Reshuffled', { deck: CFG.label });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
</body>
</html>
