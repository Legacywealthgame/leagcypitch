<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#242424">
<title>Page not found — Legacy Wealth</title>
<style>
:root{
  --charcoal:#242424;
  --cream:#F6F1E8;
  --gold:#C6A15B;
  --gold-light:#D4B483;
  --gold-dim:rgba(198,161,91,.34);
  --ivory-dim:rgba(246,241,232,.62);
  --serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--cream);background:var(--charcoal);
  -webkit-font-smoothing:antialiased;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(16px,5vw,32px);text-align:center;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 80% 55% at 22% 8%, rgba(120,120,126,.20), transparent 62%),
    radial-gradient(ellipse 65% 45% at 88% 78%, rgba(104,104,110,.16), transparent 60%),
    radial-gradient(ellipse 120% 70% at 50% 110%, rgba(28,28,29,.9), transparent 70%),
    linear-gradient(165deg,#2b2b2d 0%,#232324 44%,#1d1d1e 100%);
}
.plaque{
  width:100%;max-width:520px;
  background:linear-gradient(158deg,rgba(58,58,61,.82) 0%,rgba(36,36,38,.9) 52%,rgba(26,26,28,.94) 100%);
  border:1px solid rgba(198,161,91,.3);border-radius:3px;
  padding:clamp(30px,7vw,44px) clamp(22px,5vw,34px);position:relative;
  box-shadow:0 1px 0 rgba(246,241,232,.05) inset, 0 26px 60px -22px rgba(0,0,0,.8);
}
.plaque::before{
  content:"";position:absolute;inset:6px;
  border:1px solid rgba(198,161,91,.16);border-radius:1px;pointer-events:none;
}
.eyebrow{
  font-family:var(--serif);font-size:11.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.2em;color:var(--gold);margin-bottom:14px;
}
h1{font-family:var(--serif);font-size:clamp(28px,7vw,36px);font-weight:600;line-height:1.2;margin-bottom:16px}
p{font-size:15.5px;line-height:1.62;color:var(--ivory-dim);max-width:40ch;margin:0 auto 10px}
.links{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.btn{
  font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:.02em;
  color:var(--gold);text-decoration:none;
  border:1px solid var(--gold-dim);border-radius:2px;padding:12px 20px;
  transition:background .18s ease,border-color .18s ease;
}
a.btn:hover{background:rgba(198,161,91,.09);border-color:var(--gold)}
.footer{
  margin-top:clamp(18px,4vh,26px);font-size:10.5px;letter-spacing:.15em;
  color:rgba(246,241,232,.32);font-family:var(--serif);
}
</style>
</head>
<body>

<main class="plaque">
  <p class="eyebrow">Legacy Wealth</p>
  <h1>That page isn't here.</h1>
  <p>If you scanned a card and landed here, the link may have been typed rather than scanned. Scanning the QR code directly will take you to the right page.</p>
  <div class="links">
    <a class="btn" href="/legacypitch">Legacy Pitch</a>
    <a class="btn" href="/wealthwisdom">Wealth Wisdom</a>
    <a class="btn" href="/businessblueprint">Business Blueprint</a>
  </div>
</main>

<div class="footer">legacywealthgame.com</div>

</body>
</html>
