# Legacy Wealth — legacywealthgame.com

[build]
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Serves /legacy-pitch from legacy-pitch.html and drops the .html from URLs.
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options   = "nosniff"
    X-Frame-Options          = "SAMEORIGIN"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Card pages are reached by printed QR codes, so a stale cached copy can
# outlive a content correction with no way for the reader to know.
[[headers]]
  for = "/wealthiq/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
