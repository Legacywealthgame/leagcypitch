<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legacy Wealth Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background-color: #06b6d4;
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #22d3ee;
    }
  </style>
</head>
<body>

  <h1>Legacy Wealth Game</h1>
  <p>Select a tool below to get started:</p>
  
  <a href="/legacypitch" class="btn">Go to Legacy Pitch Generator &rarr;</a>

</body>
</html>
